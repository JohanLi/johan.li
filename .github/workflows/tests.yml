name: 'Tests'
on:
  push:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4

      # https://pnpm.io/continuous-integration#github-actions
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc
      - run: pnpm lint

      - name: Run unit tests
        run: pnpm test

      - run: pnpm exec playwright install --with-deps

      # builds the site and serves it using wrangler, see playwright.config.ts
      - name: Run end-to-end tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-report
          path: ./tests/report
          retention-days: 30
